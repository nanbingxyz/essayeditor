[package]
name = "essay-editor"
version = "1.0.0"
description = "A Desktop Editor for Essay"
authors = ["ironben"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "essay_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "=2.3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "=2.4.4"
tauri-plugin-log = "=2.9.0"
tauri-plugin-http = "=2.0.1"
tauri-plugin-process = "=2.3.1"
tauri-plugin-dialog = "=2.7.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.10.1"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.0.0", features = ["macos-private-api"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAppearance", "NSResponder", "NSView", "NSWindow"] }
window-vibrancy = "=0.6.0"
